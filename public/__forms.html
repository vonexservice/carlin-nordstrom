<!doctype html>
<html>
<head><title>Netlify Forms detection</title></head>
<body>
<form name="booking-inquiry" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="text" name="organization" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <select name="event-type"><option>Keynote</option><option>Workshop</option><option>School presentation</option><option>Conference</option><option>Community event</option><option>Corporate event</option><option>Other</option></select>
  <input type="date" name="event-date" />
  <input type="text" name="location" />
  <input type="text" name="audience" />
  <input type="text" name="audience-size" />
  <textarea name="topic"></textarea>
  <input type="text" name="budget" />
  <textarea name="additional-info"></textarea>
</form>
</body>
</html>
